[project]
name = "driftwood"
version = "0.1.0"
description = "Finds documentation that has quietly stopped being true, and measures how well it did."
readme = "README.md"
authors = [
    { name = "Julie Elkins" }
]
requires-python = ">=3.12"
dependencies = []

# Stages 1 and 2 stay dependency-free on purpose: the ground-truth layer and the
# free baselines should be regenerable in CI years from now without resolving an
# inference stack. The dense arm needs one, so it is an extra rather than a
# dependency -- `uv sync --extra embed`.
[project.optional-dependencies]
embed = [
    "numpy>=2.0",
    "sentence-transformers>=3.0",
]

[project.scripts]
driftwood = "driftwood.mining.cli:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    # numpy alone, so the chunking and pooling logic is testable against a stub
    # encoder without downloading a model or torch.
    "numpy>=2.0",
]
